<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Visão geral das notas fiscais na Nota Fácil." />
    <meta name="theme-color" content="#062d49" />
    <title>Visão geral | Nota Fácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
    <link rel="stylesheet" href="../assets/css/app.css" />
  </head>
  <body>
    <!-- Barra lateral, cabeçalho e rodapé são montados pelo assets/js/layout.js -->
    <div class="dashboard-layout" data-page="dashboard">
      <main class="dashboard-content">
        <div class="page-intro">
          <div>
            <p class="breadcrumb"><span data-empresa-crumb>ESTÚDIO AURORA</span> / VISÃO GERAL</p>
            <h1 data-saudacao>Olá. Tudo sob controle.</h1>
            <p class="intro-description">Um resumo claro para seguir com o seu dia.</p>
          </div>
          <a class="primary-action" href="../emitir/index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Emitir NFS-e
          </a>
        </div>

        <section class="invoices-section" aria-labelledby="invoices-title">
          <div class="section-heading">
            <h2 id="invoices-title">Últimas 5 notas</h2>
            <a href="../historico/index.html">Ver histórico <span aria-hidden="true">→</span></a>
          </div>

          <div class="table-wrapper">
            <table class="invoice-table">
              <thead>
                <tr>
                  <th scope="col">Nota</th>
                  <th scope="col">Tomador</th>
                  <th scope="col">Emissão</th>
                  <th scope="col">Valor</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody data-ultimas>
                <tr><td colspan="5">Carregando notas…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="../assets/js/icons.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/pages/dashboard.js"></script>
  </body>
</html>
